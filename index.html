<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 후쿠오카 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
html,body{background:var(--desk);margin:0;height:100%}
#root{height:100%}
/* VOICE  quiet travel app for two; the picture talks, the interface whispers
   IDEA   the Wild Pill hero: FUKU and OKA pushed apart by a stadium window onto Beppu at dusk
   PICTURE drawn dusk scene (sea, hills, onsen steam) inside the pill; each day gets its own little pill
   COLOUR paper #f2f2f1, ink #1d1d1d, rule #c9c9c5, black pill buttons; colour only lives inside the pills
   TYPE   Inter 800 tight for the wordmark and numerals, IBM Plex Sans KR for everything Korean
   LAYOUT phone column 430px, hairline timeline with hanging times, map preview tucked under each slot, floating pill tab bar */
:root{color-scheme:light dark;--desk:light-dark(#e2e2df,#0b0b0a);--paper:light-dark(#f2f2f1,#141413);--sheet:light-dark(#ffffff,#1d1d1b);--ink:light-dark(#1d1d1d,#ededeb);--sub:light-dark(#5b5b58,#a3a39e);--rule:light-dark(#c9c9c5,#34342f);--btn:light-dark(#1b1b1b,#f2f2f1);--btnink:light-dark(#ffffff,#141413);--tint:light-dark(#e7e7e4,#262624);--warn:light-dark(#b13f24,#ff8d70);
--s1:light-dark(#f4c7a1,#28344f);--s2:light-dark(#a9bfd9,#0f1626);--sea1:light-dark(#5d7fa6,#1d2b45);--sea2:light-dark(#36557a,#0d1525);--h1:light-dark(#8b8fa6,#2b3045);--h2:light-dark(#5e6b7e,#1d2232);--sun:light-dark(#fff3df,#e9edf7);--lamp:light-dark(#ffe3a6,#ffd27a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{color:var(--ink);font:15.5px/1.55 "IBM Plex Sans KR","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:color-mix(in srgb,var(--ink) 20%,transparent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px;border-radius:8px}
.app{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--paper);overflow:hidden}
@media(min-width:520px){#root{display:grid;place-items:center}.app{width:430px;height:min(932px,calc(100dvh - 40px));margin:0;border-radius:44px;box-shadow:0 0 0 1px var(--rule),0 30px 80px -40px rgba(0,0,0,.45)}}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);min-height:28px}
.bar b{font:800 15px "Inter",sans-serif;letter-spacing:-.03em;color:var(--ink)}
.view{display:none}.view.on{display:block}
.hero{padding:22px 0 8px}
.wm{font:800 clamp(96px,30vw,130px)/.8 "Inter",sans-serif;letter-spacing:-.055em;margin:0;display:block}
.wm.r{text-align:right;margin-top:14px}
.pill{position:relative;height:calc((min(430px,100vw) - 40px)/1.85);border-radius:999px;overflow:hidden;background:var(--s2);margin-top:14px}
.pill svg{position:absolute;inset:0;width:100%;height:100%}
.lede{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;margin-top:22px}
.lede p{margin:0;font-size:14px;line-height:1.5;color:var(--sub)}
.cta{border:0;border-radius:999px;background:var(--btn);color:var(--btnink);font:500 14px "IBM Plex Sans KR",sans-serif;padding:12px 20px;min-height:44px;white-space:nowrap}
.cta.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.cta:active{transform:scale(.97)}
.dates{display:flex;gap:6px;overflow-x:auto;margin:30px -20px 0;padding:0 20px 4px;scrollbar-width:none;position:sticky;top:-14px;background:var(--paper);z-index:3;padding-top:12px}
.dates::-webkit-scrollbar{display:none}
.dt{position:relative;z-index:1;transition:color .25s;flex:none;border:0;background:transparent;border-radius:999px;padding:8px 14px;min-height:52px;display:grid;justify-items:center;line-height:1.1;color:var(--sub);box-shadow:inset 0 0 0 1px var(--rule)}
.dt b{font:600 19px "Inter",sans-serif;letter-spacing:-.02em;color:var(--ink)}
.dt span{font-size:11.5px}
.dt.on{box-shadow:none}
.ind{position:absolute;left:0;top:0;height:0;border-radius:999px;background:var(--btn);z-index:0;pointer-events:none}
.dt:active,.map:active{transform:scale(.97)}.dt.on b,.dt.on span{color:var(--btnink)}
.deck{overflow:hidden;margin:0 -20px;touch-action:pan-y;transition:height .45s cubic-bezier(.22,1,.36,1)}
.track{display:flex;align-items:flex-start;will-change:transform;cursor:grab}
.track.drag{cursor:grabbing}
.day{flex:0 0 100%;padding:20px 20px 0;user-select:none}
.day textarea,.day input{user-select:text}
.dh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:end}
.num{font:800 92px/.78 "Inter",sans-serif;letter-spacing:-.06em}
.dh .mini{height:62px;border-radius:999px;overflow:hidden;position:relative;background:var(--s2)}
.dh .mini svg{position:absolute;inset:0;width:100%;height:100%}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px;color:var(--sub)}
.meta b{color:var(--ink);font-weight:600;font-size:17px}
.stay{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);font-size:14px}
.stay b{display:block;font-weight:600}
.stay span{color:var(--sub);font-size:13px}
.tl{list-style:none;margin:6px 0 0;padding:0}
.it{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.it .t{font:600 15px/1.35 "Inter",sans-serif;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .t small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.it .w{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it .w span{font-size:15.5px}
.ed{border:0;background:none;color:var(--sub);min-width:40px;min-height:36px;margin:-6px -8px 0 0;font-size:18px;line-height:1}
.map{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:10px;text-decoration:none;color:inherit;background:var(--sheet);border-radius:18px;padding:6px 8px 6px 6px}
.map .th{width:72px;height:54px;border-radius:13px;overflow:hidden;position:relative;background:var(--tint)}
.map .th img,.map .th svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.map b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map small{display:block;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map .go{width:36px;height:36px;border-radius:50%;background:var(--btn);color:var(--btnink);display:grid;place-items:center}
.live{margin-top:10px;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--tint)}
.live iframe,.card .ph iframe,.pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.live{position:relative;overflow:hidden}
.addmap{border:0;background:none;color:var(--sub);font-size:13px;padding:8px 0 0;min-height:36px;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--sub);font-size:14px;padding:18px 0;border-bottom:1px solid var(--rule)}
.memo{margin-top:24px}
.lbl{display:block;font-size:13px;color:var(--sub);margin:16px 0 6px}
.in{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:10px 0;font-size:16px;min-height:44px;border-radius:0}
.in:focus{outline:0;border-bottom-color:var(--ink)}
textarea.in{min-height:88px;resize:vertical;line-height:1.55}
.memo textarea{background:var(--sheet);border:0;border-radius:18px;padding:14px 16px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap}
h2{font:800 40px/.95 "Inter","IBM Plex Sans KR",sans-serif;letter-spacing:-.04em;margin:26px 0 6px}
.hint{color:var(--sub);font-size:13.5px;margin:6px 0 0}
.card{display:block;text-decoration:none;color:inherit;margin-top:18px}
.card .ph{position:relative;aspect-ratio:16/10;border-radius:26px;overflow:hidden;background:var(--tint)}
.card .ph img,.card .ph svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ph i{position:absolute;right:12px;bottom:12px;font-style:normal;background:var(--btn);color:var(--btnink);border-radius:999px;padding:7px 13px;font-size:13px}
.card .cm{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.card .cm b{font-weight:600}
.card .cm span{color:var(--sub);font-size:13px;white-space:nowrap}
.card p{margin:4px 0 0;color:var(--sub);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.big{font:300 clamp(46px,14vw,60px)/1 "Inter",sans-serif;letter-spacing:-.04em;margin:8px 0 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:4px;background:var(--rule);border-radius:9px;margin:18px 0 10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12.5px;color:var(--sub)}
.trio b{display:block;color:var(--ink);font:600 15px "Inter",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.entry{background:var(--sheet);border-radius:26px;padding:6px 18px 18px;margin-top:22px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.seg{display:inline-flex;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);padding:3px;flex:none}
.seg button{border:0;background:none;border-radius:999px;min-width:44px;min-height:38px;font-weight:600}
.seg button.on{background:var(--btn);color:var(--btnink)}
.cat{padding:13px 0;border-bottom:1px solid var(--rule)}
.cat .h{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.cat .h span{font:500 13.5px "Inter",sans-serif;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.cat .m{height:3px;background:var(--tint);margin-top:9px;border-radius:9px;overflow:hidden}
.cat .m i{display:block;height:100%;background:var(--ink)}
.cat .m i.over{background:var(--warn)}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--sub);margin-top:8px;cursor:pointer;min-height:32px}
.chk input,.todo input{accent-color:var(--ink);width:20px;height:20px;margin:0}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.ex small{display:block;color:var(--sub);font-size:12.5px}
.ex b{font:600 14.5px "Inter",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.todo{display:flex;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.todo.done span{text-decoration:line-through;color:var(--sub)}
.h3{font-size:15px;font-weight:600;margin:28px 0 0;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.tabs{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;background:var(--sheet);border-radius:999px;padding:5px;box-shadow:0 0 0 1px var(--rule),0 12px 30px -12px rgba(0,0,0,.3);z-index:6}
.tabs a{position:relative;z-index:1;transition:color .25s;display:flex;align-items:center;gap:6px;padding:0 14px;min-height:46px;border-radius:999px;color:var(--sub);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap}
.tabs a svg{width:20px;height:20px;flex:none}
.tabs a span{display:none}
.tabs a.on{color:var(--btnink)}
.tabs a.on span{display:inline}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:var(--btn);color:var(--btnink);border-radius:999px;padding:11px 18px;font-size:14px;display:none;justify-content:space-between;gap:10px;z-index:8}
.toast.on{display:flex}
.toast button{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline}
.scrim{position:absolute;inset:0;background:rgba(10,10,10,.35);display:none;z-index:9;opacity:0}
.scrim.on{display:block}
.wm .ch{display:inline-block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:32px 32px 0 0;padding:0 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;z-index:10;transform:translateY(110%);visibility:hidden}
.sheet.on{visibility:visible}
.sheet .grab{position:sticky;top:0;background:var(--sheet);padding:10px 0 12px;margin:0 -20px;touch-action:none;cursor:grab;z-index:2}
.sheet .grab i{display:block;width:40px;height:4px;border-radius:9px;background:var(--rule);margin:0 auto}
.sheet h3{font:800 26px/1 "Inter","IBM Plex Sans KR",sans-serif;letter-spacing:-.03em;margin:4px 0 4px}
.sheet .sec{font-size:13px;font-weight:600;margin:22px 0 0;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.pv{margin-top:10px;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/9;background:var(--tint)}
.pv img,.pv svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.file{display:flex;gap:10px;align-items:center;margin-top:10px}
.file label{border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);padding:10px 16px;font-size:14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.danger{border:0;background:none;color:var(--warn);font-size:14px;min-height:44px;padding:0}
@keyframes steam{0%{transform:translateY(8px);opacity:0}30%{opacity:.7}100%{transform:translateY(-26px);opacity:0}}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(440px)}}
.st{animation:steam 5.5s ease-out infinite}
.cl{animation:drift 60s linear infinite}
@media(prefers-reduced-motion:reduce){.st,.cl{animation:none}.deck{transition:none}}
</style>
</head>

/* pictures */
function scene(kind, id) {
  const g = "g" + id;
  let s = `<svg viewBox="0 0 400 216" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--s2)"/><stop offset="1" stop-color="var(--s1)"/></linearGradient><linearGradient id="${g}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sea1)"/><stop offset="1" stop-color="var(--sea2)"/></linearGradient></defs><rect width="400" height="216" fill="url(#${g})"/>`;
  const cloud = `<g class="cl" opacity=".55"><ellipse cx="0" cy="44" rx="34" ry="7" fill="var(--sun)"/><ellipse cx="24" cy="40" rx="20" ry="6" fill="var(--sun)"/></g>`;
  if (kind === "hero" || kind === "onsen" || kind === "sea") {
    s += `<circle cx="292" cy="118" r="30" fill="var(--sun)" opacity=".9"/>` + cloud;
    s += `<path d="M0 118 C40 96 70 84 112 100 C150 76 186 70 226 96 C262 82 300 90 330 104 C356 96 380 100 400 108 V150 H0Z" fill="var(--h1)"/>`;
    s += `<path d="M0 134 C60 116 110 112 160 128 C210 116 270 118 320 130 C350 124 380 126 400 130 V150 H0Z" fill="var(--h2)"/>`;
    s += `<rect y="148" width="400" height="68" fill="url(#${g}w)"/><path d="M0 148H400" stroke="var(--sun)" stroke-opacity=".5"/>`;
    for (let i = 0; i < 6; i++) s += `<path d="M${180 + i * 34} ${164 + (i % 3) * 14}h${18 + (i % 2) * 14}" stroke="var(--sun)" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>`;
    if (kind !== "sea") [[60, 0], [104, 1.6], [150, 3.1]].forEach(([x, d]) => { s += `<path class="st" style="animation-delay:${d}s" d="M${x} 128 q-8 -12 0 -24 q8 -12 0 -24" stroke="var(--sun)" stroke-width="6" stroke-linecap="round" fill="none"/>`; });
  } else if (kind === "flight" || kind === "home") {
    s += `<circle cx="${kind === "home" ? 300 : 90}" cy="${kind === "home" ? 150 : 70}" r="${kind === "home" ? 36 : 18}" fill="var(--sun)" opacity=".9"/>` + cloud;
    s += `<path d="M0 176 C90 160 180 168 260 176 C320 170 370 172 400 176 V216 H0Z" fill="var(--h2)"/>`;
    s += `<g transform="translate(${kind === "home" ? 120 : 170} ${kind === "home" ? 84 : 96}) rotate(${kind === "home" ? -10 : -6})" fill="var(--sun)"><path d="M0 10 L120 4 Q134 4 134 10 Q134 16 120 16 L0 12Z"/><path d="M58 9 L36 -18 L48 -18 L82 8Z M58 12 L40 34 L52 34 L82 13Z" opacity=".85"/><path d="M4 10 L-6 -6 L4 -6 L16 9Z" opacity=".85"/></g>`;
  } else {
    const night = kind === "night";
    let seed = night ? 977 : 331; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
    s += cloud;
    for (let x = -4; x < 404;) { const w = 20 + r() * 24, h = 46 + r() * 80; s += `<rect x="${x.toFixed(0)}" y="${(196 - h).toFixed(0)}" width="${(w - 3).toFixed(0)}" height="${(h + 24).toFixed(0)}" fill="${r() > .5 ? "var(--h1)" : "var(--h2)"}"/>`;
      if (night) for (let y = 202 - h; y < 190; y += 11) if (r() > .35) s += `<rect x="${(x + 5).toFixed(0)}" y="${y.toFixed(0)}" width="${(w - 13).toFixed(0)}" height="3" fill="var(--lamp)" opacity=".7"/>`;
      x += w; }
    s += `<path d="M300 196 V60 L306 40 L312 60 V196Z" fill="var(--h2)"/><rect y="194" width="400" height="22" fill="var(--sea2)"/>`;
  }
  return s + "</svg>";
}
function pinMap(t) {
  let seed = [...t].reduce((a, c) => a + c.charCodeAt(0), 11) * 197; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  let s = '<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="100" fill="var(--tint)"/>';
  s += `<path d="M${(r() * 70).toFixed(0)} 0 Q${(60 + r() * 50).toFixed(0)} 50 ${(110 + r() * 50).toFixed(0)} 100 H160 V${(60 + r() * 30).toFixed(0)} Q120 50 160 ${(r() * 30).toFixed(0)}Z" fill="var(--s2)" opacity=".55"/>`;
  for (let i = 0; i < 5; i++) { const y = r() * 100, x = r() * 160; s += `<path d="M0 ${y.toFixed(0)} L160 ${(y + r() * 30 - 15).toFixed(0)}M${x.toFixed(0)} 0 L${(x + r() * 30 - 15).toFixed(0)} 100" stroke="var(--paper)" stroke-width="${(2 + r() * 3).toFixed(1)}"/>`; }
  return s + '<g transform="translate(80 54)"><ellipse cy="17" rx="8" ry="2.5" fill="var(--ink)" opacity=".2"/><path d="M0 16 C-3 8 -11 3 -11 -5 A11 11 0 1 1 11 -5 C11 3 3 8 0 16Z" fill="var(--ink)"/><circle cy="-5" r="4" fill="var(--paper)"/></g></svg>';
}

/* views */
function dday() {
  const now = new Date(), t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const st = new Date(2026, 10, 29), en = new Date(2026, 11, 4), d = Math.round((st - t) / 864e5);
  return d > 0 ? `출발까지 ${d}일` : t <= en ? `여행 ${Math.round((t - st) / 864e5) + 1}일째` : "다녀왔어요";
}

}

  const el = $("#v-" + h);
  el.innerHTML = h === "plan" ? planView() : h === "map" ? mapView() : h === "budget" ? budgetView() : todoView();
  if (h === "plan") requestAnimationFrame(() => { bindDrag(); goDay(cur, true); });
  if (h === "map" && MO && MO.inView && !RM) $$(".card").forEach(c => { c.style.opacity = 0; MO.inView(c, () => { MO.animate(c, {opacity: [0, 1], y: [24, 0]}, {duration: .55, ease: [.22, 1, .36, 1]}); }); });
  if (h === "budget") { const el = $(".big"), to = S.total - S.budget.reduce((a, b) => a + spent(b), 0), from = lastLeft === null ? S.total : lastLeft; lastLeft = to; tween(from, to, {stiffness: 120, damping: 24}, v => { el.textContent = won(v); }); }
  if (h === "todo") enter($$(".todo"), {gap: .03, y: 10});

}
const redraw = () => { const sc = $("#sc"), y = sc.scrollTop; draw(view()); sc.scrollTop = y; };
function route() {
  closeSheet();
  let h = (location.hash || "#plan").slice(1); const m = /^day([1-6])$/.exec(h);
  if (m) { cur = +m[1] - 1; h = "plan"; }
  if (!["plan", "map", "budget", "todo"].includes(h)) h = "plan";
  const changed = view() !== h || !$(".view.on");
  $$(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + h));
  $$(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === h));
  draw(h); if (changed) $("#sc").scrollTop = 0;
  requestAnimationFrame(() => moveInd($("#tabInd"), $(".tabs a.on"), !tabSeen)); tabSeen = true;
  if (changed && h !== "plan") enter([$("#v-" + h + " h2"), $("#v-" + h + " .hint")].filter(Boolean), {gap: .06});
}
let tabSeen = false;
let tx = 0, txAnim = 0;
const setX = v => { tx = v; const tr = $("#track"); if (tr) tr.style.transform = `translateX(${v}px)`; };
function fitDeck() { const dk = $("#deck"), d = $("#day-" + cur); if (dk && d) dk.style.height = d.offsetHeight + "px"; }
function moveInd(ind, el, instant) {
  if (!ind || !el) return; const to = {l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight};
  const from = ind._p || to; ind._p = to; ind.style.top = to.t + "px"; ind.style.height = to.h + "px";
  const go = k => { ind.style.left = (from.l + (to.l - from.l) * k) + "px"; ind.style.width = (from.w + (to.w - from.w) * k) + "px"; };
  instant ? go(1) : tween(0, 1, {stiffness: 380, damping: 30}, go);
}
function goDay(i, instant) {
  const prev = cur; cur = Math.max(0, Math.min(S.days.length - 1, i));
  const dk = $("#deck"); if (!dk) return;
  const W = dk.clientWidth, target = -cur * W, id = ++txAnim;
  if (instant) setX(target); else tween(tx, target, {}, v => { if (id === txAnim) setX(v); });
  $$(".dt").forEach((b, k) => b.classList.toggle("on", k === cur));
  const chip = $$(".dt")[cur]; moveInd($("#dateInd"), chip, instant);
  if (chip && !instant) { const dn = $("#dates"); dn.scrollTo({left: chip.offsetLeft - dn.clientWidth / 2 + chip.offsetWidth / 2, behavior: RM ? "auto" : "smooth"}); }
  fitDeck();
  if (!instant && prev !== cur) enter($$("#day-" + cur + " .it, #day-" + cur + " .num"), {gap: .035});
  try { history.replaceState(null, "", "#day" + (cur + 1)); } catch (e) {}
}
function bindDrag() {
  const dk = $("#deck"), tr = $("#track"); if (!dk || dk._b) return; dk._b = 1;
  let x0 = 0, y0 = 0, base = 0, mode = 0, last = 0, lt = 0, vx = 0;
  dk.addEventListener("pointerdown", e => { if (e.button > 0 || e.target.closest("textarea,input,select,button,iframe")) return; x0 = e.clientX; y0 = e.clientY; lt = performance.now(); last = x0; base = tx; mode = 1; vx = 0; });
  dk.addEventListener("pointermove", e => {
    if (!mode) return; const dx = e.clientX - x0, dy = e.clientY - y0;
    if (mode === 1) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { mode = 0; return; } if (Math.abs(dx) > 8) { mode = 2; ++txAnim; base = tx; dk.setPointerCapture(e.pointerId); tr.classList.add("drag"); } else return; }
    const W = dk.clientWidth, min = -(S.days.length - 1) * W; let v = base + dx;
    if (v > 0) v *= .35; if (v < min) v = min + (v - min) * .35;
    const n = performance.now(); vx = (e.clientX - last) / Math.max(1, n - lt); last = e.clientX; lt = n; setX(v);
  });
  const end = e => { if (mode !== 2) { mode = 0; return; } mode = 0; tr.classList.remove("drag"); dk._moved = Date.now();
    const W = dk.clientWidth, dx = e.clientX - x0; let i = cur;
    if (dx < -W * .18 || vx < -.45) i = cur + 1; else if (dx > W * .18 || vx > .45) i = cur - 1;
    goDay(i); };
  dk.addEventListener("pointerup", end); dk.addEventListener("pointercancel", end);
  dk.addEventListener("click", e => { if (dk._moved && Date.now() - dk._moved < 250) { e.preventDefault(); e.stopPropagation(); } }, true);
}
function reveal() {
  const p = $("#heroPill"); if (!p || !p.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  try { if (sessionStorage.getItem("fk2-rev")) return; sessionStorage.setItem("fk2-rev", 1); } catch (e) {}
  const H = p.offsetHeight;
  p.animate([{height: "2px", clipPath: "inset(0 50% 0 50%)", offset: 0}, {height: "2px", clipPath: "inset(0 0 0 0)", offset: .16}, {height: H * .1 + "px", offset: .32}, {height: H * .55 + "px", offset: .6}, {height: H + "px", clipPath: "inset(0 0 0 0)"}], {duration: 2100, easing: "cubic-bezier(.4,0,.2,1)"});
  $$(".wm .ch").forEach((c, k) => c.animate([{transform: "translateY(.5em)", opacity: 0, filter: "blur(8px)"}, {transform: "none", opacity: 1, filter: "blur(0)"}], {duration: 900, delay: 250 + k * 60, easing: "cubic-bezier(.22,1,.36,1)", fill: "backwards"}));
}

/* sheet */
function openSheet(di, id) {
  const d = S.days[di], it = id ? d.items.find(x => x.id === id) : null, p = it && it.place;
  edit = {di, id: it ? it.id : null}; pendImg = null;
  $("#sh-h").textContent = it ? "일정 편집" : "일정 추가";
  $("#f-day").value = di; $("#f-t").value = it ? it.t : ""; $("#f-txt").value = it ? it.txt : "";
  $("#f-name").value = p ? p.name : ""; $("#f-url").value = p ? p.url : ""; $("#f-memo").value = p ? p.memo : "";
  $("#f-img").value = ""; $("#f-del").style.visibility = it ? "visible" : "hidden";
  showPv(p ? p.img : "");
  showSheet();
  setTimeout(() => (it ? $("#f-name") : $("#f-t")).focus({preventScroll: true}), 300);
}
function showPv(src) { const nm = $("#f-name").value.trim(); $("#f-pv").innerHTML = imgOk(src) ? `<img src="${esc(src)}" alt="미리보기">` : nm ? frame({name: nm, q: nm}) : pinMap("장소"); }
let shY = 1e4;
function sheetTo(y, done) { const sh = $("#sheet"), sc = $("#scrim"), H = sh.offsetHeight || 600; return tween(Math.min(shY, H), y, {stiffness: 340, damping: 34}, v => { shY = v; sh.style.transform = `translateY(${v}px)`; sc.style.opacity = Math.max(0, 1 - v / H); }).then(done || (() => {})); }
function showSheet() { const sh = $("#sheet"); $("#scrim").classList.add("on"); sh.classList.add("on"); sh.scrollTop = 0; shY = sh.offsetHeight; sh.style.transform = `translateY(${shY}px)`; sheetTo(0); }
function closeSheet() { const sh = $("#sheet"); if (!sh || !sh.classList.contains("on")) return; sheetTo(sh.offsetHeight + 20, () => { sh.classList.remove("on"); $("#scrim").classList.remove("on"); }); }
function bindSheetDrag() {
  const g = $("#grab"), sh = $("#sheet"); let y0 = 0, on = false, ly = 0, lt = 0, vy = 0;
  g.addEventListener("pointerdown", e => { on = true; y0 = e.clientY; ly = y0; lt = performance.now(); vy = 0; g.setPointerCapture(e.pointerId); });
  g.addEventListener("pointermove", e => { if (!on) return; const d = e.clientY - y0, dy = d > 0 ? d : d * .2; const n = performance.now(); vy = (e.clientY - ly) / Math.max(1, n - lt); ly = e.clientY; lt = n; shY = dy; sh.style.transform = `translateY(${dy}px)`; $("#scrim").style.opacity = Math.max(0, 1 - Math.max(0, dy) / sh.offsetHeight); });
  const up = () => { if (!on) return; on = false; (shY > 120 || vy > .6) ? closeSheet() : sheetTo(0); };
  g.addEventListener("pointerup", up); g.addEventListener("pointercancel", up);
}

const mins = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
function placeAt(items, it) {
  const v = mins(it.t); if (v === null) return items.push(it);
  const k = items.findIndex(x => mins(x.t) !== null && mins(x.t) > v); k < 0 ? items.push(it) : items.splice(k, 0, it);
}
async function shrink(file, max) {
  const u = URL.createObjectURL(file);
  const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = u; });
  const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
  c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); return c;
}

/* events */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
  if (t.id === "undo" && undo) { S = undo; undo = null; clearTimeout(timer); redraw(); toast("되돌렸습니다"); if (!art) try { localStorage.setItem("fk2", JSON.stringify(S)); } catch (x) {} return; }
  if (d.live) { const box = document.getElementById("live-" + d.live); const [i, id] = d.live.split("-"); const it = S.days[+i].items.find(x => x.id === id);
    const open = box.hidden; t.setAttribute("aria-expanded", open); t.textContent = open ? "지도 접기" : "실시간 지도 펼치기";
    if (open) { box.hidden = false; box.innerHTML = frame(it.place); const H = box.offsetHeight; box.style.aspectRatio = "auto"; tween(0, H, {stiffness: 260, damping: 30}, v => { box.style.height = v + "px"; fitDeck(); }).then(() => { box.style.height = ""; box.style.aspectRatio = ""; fitDeck(); }); }
    else { const H = box.offsetHeight; box.style.aspectRatio = "auto"; tween(H, 0, {stiffness: 300, damping: 34}, v => { box.style.height = v + "px"; fitDeck(); }).then(() => { box.hidden = true; box.innerHTML = ""; box.style.height = ""; box.style.aspectRatio = ""; fitDeck(); }); }
    return; }

  if (t.id === "bk-out") { const b = new Blob([JSON.stringify(S)], {type: "application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "fukuoka-trip-backup.json"; a.click(); return toast("백업 파일을 내려받았습니다"); }
  if (d.go !== undefined) return goDay(+d.go);
  if (d.add !== undefined) return openSheet(+d.add);
  if (d.ed) { const [i, id] = d.ed.split(":"); return openSheet(+i, id); }
  if (d.addmap) { const [i, id] = d.addmap.split(":"); return openSheet(+i, id); }
  if (d.memo !== undefined) { S.days[+d.memo].note = $("#memo-" + d.memo).value; return save("메모를 저장했습니다"); }
  if (d.cur) { $$("#x-cur button").forEach(b => b.classList.toggle("on", b === t)); return; }
  if (d.dx) { const snap = clone(S); S.expenses = S.expenses.filter(x => x.id !== d.dx); redraw(); return save("지출을 지웠습니다", snap); }
  if (t.id === "x-add") { const a = parseFloat($("#x-amt").value.replace(/[^\d.]/g, "")); if (!(a > 0)) return $("#x-amt").focus();
    S.expenses.push({id: uid(), cat: $("#x-cat").value, day: $("#x-day").value, amount: a, cur: ($("#x-cur .on") || {dataset: {}}).dataset.cur || "JPY", memo: $("#x-memo").value.trim()}); redraw(); return save("지출을 기록했습니다"); }
  if (t.id === "todo-add") { const v = $("#todo-new").value.trim(); if (!v) return $("#todo-new").focus(); S.todos.push({id: uid(), txt: v, done: false}); redraw(); return save("추가했습니다"); }
  if (t.id === "f-cancel") return closeSheet();
  if (t.id === "f-noimg") { pendImg = ""; return showPv(""); }
  if (t.id === "f-del") { const snap = clone(S); const d0 = S.days[edit.di]; d0.items = d0.items.filter(x => x.id !== edit.id); closeSheet(); redraw(); return save("일정을 삭제했습니다", snap); }
  if (t.id === "f-save") {
    const txt = $("#f-txt").value.trim(); if (!txt) return $("#f-txt").focus();
    const url = $("#f-url").value.trim(); if (url && !httpsOk(url)) { toast("링크는 https:// 로 시작해야 합니다"); return $("#f-url").focus(); }
    const di = +$("#f-day").value, old = edit.id ? S.days[edit.di].items.find(x => x.id === edit.id) : null;
    const it = old || {id: uid(), t: "", txt: "", sub: "", place: null};
    const name = $("#f-name").value.trim(), timeChanged = !old || old.t !== $("#f-t").value.trim();
    it.t = $("#f-t").value.trim() || "미정"; it.txt = txt;
    if (name) { const p = it.place || {q: ""}; if (p.name !== name) p.q = name; Object.assign(p, {name, url, memo: $("#f-memo").value.trim()}); if (pendImg !== null) p.img = pendImg; else p.img = p.img || ""; it.place = p; }
    else it.place = null;
    if (old && (edit.di !== di || timeChanged)) S.days[edit.di].items = S.days[edit.di].items.filter(x => x.id !== it.id);
    if (!old || edit.di !== di || timeChanged) placeAt(S.days[di].items, it);
    cur = di; closeSheet(); redraw(); return save(old ? "일정을 고쳤습니다" : "일정을 추가했습니다");
  }
});
document.addEventListener("change", async e => {
  const t = e.target, d = t.dataset;
  if (d.todo) { S.todos.find(x => x.id === d.todo).done = t.checked; redraw(); return save(t.checked ? "정했습니다" : "다시 정할 것으로 돌렸습니다"); }
  if (d.paid) { S.budget.find(x => x.id === d.paid).paid = t.checked; redraw(); return save("예산에 반영했습니다"); }
  if (t.id === "bk-in" && t.files[0]) { try { const o = JSON.parse(await t.files[0].text()); if (o.v === 2 && o.days) { S = o; redraw(); save("백업을 불러왔습니다"); } else toast("이 앱의 백업 파일이 아닙니다"); } catch (x) { toast("파일을 읽지 못했습니다"); } return; }
  if (t.id === "rate") { const r = parseFloat(t.value); if (r > 0) { S.rate = r; redraw(); save("환율을 바꿨습니다"); } return; }
  if (t.id === "f-img" && t.files[0]) {
    $("#f-pv").innerHTML = '<p class="hint" style="padding:14px">사진 준비 중</p>';
    try {
      if (assets) { const c = await shrink(t.files[0], 1200); const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", .85)); pendImg = (await assets.upload(blob)).url; }
      else { const c = await shrink(t.files[0], 640); pendImg = c.toDataURL("image/jpeg", .72); }
      showPv(pendImg);
    } catch (x) { pendImg = null; $("#f-pv").innerHTML = '<p class="hint" style="padding:14px">사진을 올리지 못했습니다. JPG나 PNG로 다시 올려주세요.</p>'; }
  }
});
let pvT; document.addEventListener("input", e => { if (e.target.closest && e.target.closest(".day")) fitDeck(); if (e.target.id === "f-name") { clearTimeout(pvT); pvT = setTimeout(() => { if (pendImg) return; const p = edit && edit.id ? S.days[edit.di].items.find(x => x.id === edit.id) : null; showPv(pendImg === null && p && p.place && imgOk(p.place.img) ? p.place.img : ""); }, 600); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeSheet();
  if (view() === "plan" && !$("#sheet").classList.contains("on") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { if (e.key === "ArrowRight") goDay(cur + 1); if (e.key === "ArrowLeft") goDay(cur - 1); }
});

function local() {
  $("#sync").textContent = "이 브라우저에 저장";
  try { if (JSON.parse($("#state").textContent).v !== 2) { const l = localStorage.getItem("fk2"); if (l) { S = JSON.parse(l); redraw(); } } } catch (e) {}
}
shell(); route(); reveal();
$("#scrim").addEventListener("click", closeSheet);
bindSheetDrag();
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { goDay(cur, true); moveInd($("#tabInd"), $(".tabs a.on"), true); });
if (document.fonts) document.fonts.ready.then(() => { moveInd($("#dateInd"), $$(".dt")[cur], true); moveInd($("#tabInd"), $(".tabs a.on"), true); fitDeck(); });
local();
}
