<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b7be0">
<title>우리 후쿠오카 여행</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="후쿠오카 여행">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#e9edf2}
/* VOICE  airy, clean, one calm screen per day
   IDEA   a weather-app-like day card: the place's real photo melts into sky blue, then into white paper
   PICTURE real photo of that day's town at the top, fading into blue then white
   COLOUR sky #3b7be0 to #8fb6ef, paper #ffffff, cards #f3f5f8, ink #0f1115, one black round button
   TYPE   Inter light for the big numbers, IBM Plex Sans KR for Korean
   LAYOUT hero (photo, curved date picker, segment, big date, three frosted tiles) over a white sheet with tabs and cards; bottom bar */
:root{--sky:#3b7be0;--sky2:#8fb6ef;--paper:#fff;--card:#f3f5f8;--ink:#0f1115;--sub:#7b828e;--line:#e6e9ee;--ok:#1fa971;--warn:#e0613b}
*{box-sizing:border-box;min-width:0}
body{color:var(--ink);font:15px/1.5 "IBM Plex Sans KR","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:10px}
#root{height:100%}
.app{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--paper)}
@media(min-width:520px){#root{display:grid;place-items:center}.app{width:430px;height:min(932px,calc(100dvh - 40px));border-radius:52px;box-shadow:0 0 0 10px #111,0 0 0 12px #cfd4db,0 40px 90px -40px rgba(20,30,60,.5)}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:110px}
.scroll::-webkit-scrollbar{display:none}
.hero{position:relative;color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 84px;overflow:hidden;touch-action:pan-y}
.ph{position:absolute;inset:0;z-index:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 48%,rgba(0,0,0,.82) 58%,rgba(0,0,0,.55) 68%,rgba(0,0,0,.28) 77%,rgba(0,0,0,.1) 84%,rgba(0,0,0,.02) 89%,transparent 92%);mask-image:linear-gradient(180deg,#000 0%,#000 48%,rgba(0,0,0,.82) 58%,rgba(0,0,0,.55) 68%,rgba(0,0,0,.28) 77%,rgba(0,0,0,.1) 84%,rgba(0,0,0,.02) 89%,transparent 92%)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,16,.5) 0%,rgba(8,10,16,.24) 30%,rgba(8,10,16,.2) 50%,rgba(8,10,16,.08) 64%,rgba(8,10,16,0) 74%)}
.hero.plain .ph{background:linear-gradient(180deg,#2a2f3a 0%,#59606d 45%,#c9ccd2 72%,#fff 92%)}
.hero.plain .ph::after{display:none}
.hero>*:not(.ph){position:relative;z-index:1}
.arc{position:relative;height:66px;margin:0 -20px}
.arc button{position:absolute;top:0;left:50%;width:64px;margin-left:-32px;border:0;background:none;color:#fff;display:grid;justify-items:center;line-height:1.15;padding:4px 0;font-size:14px;will-change:transform,opacity}
.arc button b{font:500 17px "Inter",sans-serif}
.arc button.on b{font-weight:600}
.seg{position:relative;display:flex;width:max-content;margin:14px auto 0;padding:3px;border-radius:999px;gap:2px}
.seg a{position:relative;z-index:1;color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;transition:color .25s}
.seg a.on{color:#fff}
.seg{background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.seg .ind{background:rgba(255,255,255,.3)}
.segwrap{position:relative}
.segwrap .rf{position:absolute;right:-2px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(0,0,0,.12);transition:transform .15s}
.segwrap .rf svg{width:17px;height:17px;display:block;transition:opacity .2s}
.segwrap .rf::after{content:"";position:absolute;inset:-6px;border-radius:50%}
.segwrap .rf{touch-action:manipulation}
.segwrap .rf:active{transform:translateY(-50%) scale(.94)}
.segwrap .rf.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ind{position:absolute;left:0;top:0;height:0;border-radius:999px;pointer-events:none;z-index:0}
.big{text-align:center;font:300 clamp(96px,30vw,128px)/1 "Inter",sans-serif;letter-spacing:-.04em;margin:18px 0 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.big.money{font-size:clamp(56px,17vw,84px);margin-top:26px}
.big small{font-size:.32em;letter-spacing:-.01em;margin-left:4px}
.cap{text-align:center;font-size:15px;margin-top:4px;color:rgba(255,255,255,.95);text-shadow:0 1px 10px rgba(0,0,0,.35)}
.big,.arc button,.seg a{text-shadow:0 2px 16px rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:26px}
.tile{border-radius:18px;padding:14px 8px;text-align:center;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink)}
.tile span{display:block;font-size:13px;color:#5d6574}
.tile b{display:block;font:600 18px "Inter","IBM Plex Sans KR",sans-serif;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;justify-content:center;gap:5px;margin-top:12px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(15,17,21,.18)}
.dots i.on{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.credit{text-align:center;font-size:11px;color:rgba(255,255,255,.75);margin-top:10px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.credit a{color:inherit}
.main{padding:0 20px 0;margin-top:-30px;position:relative}
h2{font-size:19px;font-weight:600;margin:10px 0 12px;letter-spacing:-.01em}
.tabs{position:relative;display:flex;background:var(--card);border-radius:999px;padding:4px}
.tabs button{position:relative;z-index:1;flex:1;border:0;background:none;padding:9px 0;border-radius:999px;color:var(--sub);font-weight:500;font-size:14.5px;transition:color .25s}
.tabs button.on{color:var(--ink)}
.tabs .ind{background:#fff;box-shadow:0 1px 4px rgba(15,17,21,.08)}
.card{background:var(--card);border-radius:22px;padding:16px;margin-top:12px}
.card.it{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px 12px 12px;border-radius:20px;margin-top:10px}
.note{grid-column:1/-1;margin-top:8px;width:100%;border:0;border-radius:12px;background:#fff;padding:8px 12px;font-size:13.5px;line-height:1.45;resize:none;overflow:hidden;min-height:36px;color:var(--ink)}
.note::placeholder{color:#a9afb8}
.note:focus{outline:0;box-shadow:0 0 0 1.5px var(--ink)}
.th{position:relative;width:76px;height:76px;border-radius:16px;overflow:hidden;background:#e2e7ee;display:grid;place-items:center;color:var(--sub);border:0;padding:0}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th iframe{position:absolute;left:-62px;top:-62px;width:200px;height:200px;border:0;pointer-events:none}
.th.add svg{width:20px;height:20px}
.th.ic{background:#fff;color:var(--ink);width:52px;height:52px;margin-left:12px}
.card.it.stay{grid-template-columns:76px minmax(0,1fr) auto}
.mid{border:0;background:none;text-align:left;padding:0;display:block;min-width:0}
.mid b{display:block;font-weight:600;font-size:16px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{display:block;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small.cr{font-size:10.5px;color:#a3a9b3}
.mid small.cr:empty{display:none}
.card.it .t{font:400 24px/1 "Inter",sans-serif;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.card.it .t.w{font-size:14px;font-weight:500;color:var(--sub)}
.ch{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ch b{font-weight:600;font-size:15.5px;display:block}
.ch small{display:block;color:var(--sub);font-size:13px;margin-top:1px}
.ch .t{font:400 26px/1 "Inter",sans-serif;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.ch .t.w{font-size:16px;font-weight:500;padding-top:4px}
.gm{position:relative;display:block;margin-top:12px;height:150px;border-radius:16px;overflow:hidden;background:#e2e7ee}
.gm iframe{position:absolute;inset:-40px 0;width:100%;height:calc(100% + 80px);border:0;pointer-events:none}
.gm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gm>a{position:absolute;inset:0}
.gm .by{position:absolute;right:8px;bottom:8px;z-index:2;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);border-radius:999px;padding:3px 8px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm .by a{color:#fff;text-decoration:none}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--sub)}
.foot .st{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.foot .st i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.lk{border:0;background:none;color:var(--sub);font-size:12.5px;padding:4px 0;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.go{display:inline-flex;align-items:center;gap:4px;color:var(--ink);text-decoration:none;font-weight:500;font-size:13px;min-height:32px}
.stay .t{font-size:15px;font-weight:500}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:26px 10px}
.bigmap{position:relative;height:320px;border-radius:22px;overflow:hidden;margin-top:12px;background:#e2e7ee}
.bigmap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pills{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:0;border-radius:999px;background:var(--card);padding:9px 14px;font-size:13.5px;white-space:nowrap}
.pill.on{background:var(--ink);color:#fff}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-size:16px;min-height:46px}
.in:focus{outline:0;border-color:var(--ink)}
textarea.in{min-height:120px;resize:vertical;line-height:1.55}
.card .in{background:#fff}
.lbl{display:block;font-size:12.5px;color:var(--sub);margin:14px 2px 6px}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:12px 20px;min-height:44px;font-weight:500;font-size:14px}
.btn.soft{background:var(--card);color:var(--ink)}
.btn:active,.pill:active,.fab:active{transform:scale(.96)}
.gauge{position:relative;height:8px;border-radius:9px;background:#e1e5eb;margin-top:16px}
.gauge i{position:absolute;top:0;bottom:0;left:0;border-radius:9px;background:linear-gradient(90deg,#f6b26b,#f0c49a 45%,#6fa3ef)}
.gauge u{position:absolute;top:12px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:8px solid #9aa2ad;margin-left:-6px}
.scale{display:flex;justify-content:space-between;font:400 11px "Inter",sans-serif;color:var(--sub);margin-top:16px}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:12.5px}
.chk.on{color:var(--ink);font-weight:600}
.chk input,.todo input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.cur{display:inline-flex;background:#fff;border-radius:999px;padding:3px;border:1px solid var(--line);flex:none}
.cur button{border:0;background:none;border-radius:999px;min-width:42px;min-height:38px;font-weight:600}
.cur button.on{background:var(--ink);color:#fff}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex b{font:500 15px "Inter",sans-serif;white-space:nowrap}
.ex small{display:block;color:var(--sub);font-size:12.5px}
.x{border:0;background:none;color:var(--sub);min-width:36px;min-height:36px;font-size:18px}
.bamt{width:4.4em;border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:13px;min-height:28px;text-align:right;background:#fff;margin:0 2px}
.sheet.chat{height:88%;display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:center}
.log{flex:1;overflow-y:auto;padding:10px 0 12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{background:var(--card);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg.sys{align-self:center;background:none;color:var(--sub);font-size:12px;padding:2px 8px}
.msg.card-add{align-self:stretch;max-width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);white-space:normal}
.msg.card-add .th{width:64px;height:64px}
.msg.card-add b{display:block;font-weight:600}.msg.card-add small{display:block;color:var(--sub);font-size:12.5px}
.msg.card-add .ok{font-size:12px;font-weight:600;color:var(--ok)}
.typing{display:flex;gap:4px;align-items:center;min-height:40px}
.typing i{width:6px;height:6px;border-radius:50%;background:#a3a9b3;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.composer .in{flex:1;min-width:0;min-height:44px;height:44px;max-height:120px;resize:none;border-radius:22px;padding:10px 16px;line-height:1.5;overflow-y:hidden;scrollbar-width:none}
.composer .in::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer .mic{width:44px;height:44px;padding:0;justify-content:center;background:var(--card);flex:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.agbox{background:var(--card);border-radius:20px;padding:12px;margin-top:12px}
.agbox .in{background:#fff;border:0;min-height:84px}
.mic{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:#fff;padding:10px 16px;min-height:44px;font-weight:500}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--warn);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(224,97,59,.18)}}
.agi{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.agi .t{font:500 16px "Inter",sans-serif}.agi b{display:block;font-weight:600}.agi small{color:var(--sub);font-size:12.5px}
.seg2{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg2 button{flex:1;border:0;background:none;border-radius:999px;min-height:40px;font-weight:500;font-size:14px;color:var(--sub)}
.seg2 button.on{background:var(--ink);color:#fff}
.rc{padding:6px}
.rcbtn{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#3b7be0,#8fb6ef);color:#fff;cursor:pointer}
.rcbtn b{display:block;font-size:16px;font-weight:600}.rcbtn small{display:block;font-size:12.5px;opacity:.9}
.rci{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.rci svg{width:24px;height:24px}
.rcp{display:flex;gap:12px;align-items:center;padding:12px 10px 6px;font-size:13px;color:var(--sub)}
.rcp img{width:54px;height:72px;object-fit:cover;border-radius:10px;flex:none}
.settle .sv,.sv{margin:8px 0 0;color:var(--sub);font-size:13.5px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.split div{background:#fff;border-radius:14px;padding:10px 12px}
.split span{display:block;font-size:12px;color:var(--sub)}.split b{font:600 15px "Inter",sans-serif;white-space:nowrap}
.filters{display:flex;gap:6px;margin-top:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.tag.shared{background:#e3edfc;color:#2e64c0}.tag.personal{background:#fdeee5;color:#c0592e}
.todo{display:flex;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.todo:last-child{border-bottom:0}
.todo.done span{text-decoration:line-through;color:var(--sub)}
.pk{display:flex;align-items:center;gap:4px;padding:13px 0;border-bottom:1px solid var(--line)}
.pk:last-child{border-bottom:0}
.pkl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer}
.pkl input{width:18px;height:18px;margin:0;accent-color:var(--ink);flex:none}
.pkl b{display:block;font-weight:600;font-size:15.5px}
.pkl small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.pk.done b{text-decoration:line-through;color:var(--sub)}
.pk.done small{opacity:.7}
.tabs button{white-space:nowrap}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.95) 45%);pointer-events:none}
.nav{pointer-events:auto;display:flex;gap:4px;align-items:center;background:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 0 0 1px var(--line),0 12px 30px -14px rgba(20,30,60,.35)}
.nav a{width:58px;display:grid;justify-items:center;gap:1px;color:#a3a9b3;text-decoration:none;font-size:10.5px;font-weight:500;padding:4px 0}
.nav a.on{color:var(--ink)}
.nav svg{width:22px;height:22px}
.nav .fab{margin:0 6px}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
.fab svg{width:24px;height:24px}
.scrim{position:absolute;inset:0;background:rgba(15,17,21,.32);z-index:10;opacity:0;pointer-events:none}
.scrim.on{pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;z-index:11;background:#fff;border-radius:30px 30px 0 0;padding:0 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(110%)}
.grip{position:sticky;top:0;background:#fff;padding:10px 0 8px;margin:0 -20px;touch-action:none;z-index:2;cursor:grab}
.grip i{display:block;width:40px;height:4px;border-radius:9px;background:#d5d9df;margin:0 auto}
.sheet h3{font-size:22px;font-weight:600;margin:6px 0 2px;letter-spacing:-.01em}
.prev{position:relative;margin-top:10px;border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:var(--card)}

function localParse(text) {
  const out = [], parts = text.replace(/\s+/g, " ").split(/\s*(?:그리고|다음에|,|\n)\s*/).filter(x => x && x.length > 1); let day = cur;

    else if ((m = seg.match(/(\d)\s*일\s*차/))) { day = Math.min(5, +m[1] - 1); seg = seg.replace(m[0], " "); }
    else if (/내일/.test(seg)) { day = Math.min(5, cur + 1); seg = seg.replace("내일", " "); }
    if ((m = seg.match(/(오전|오후|저녁|밤|아침|점심)?\s*(\d{1,2})\s*시\s*(반)?/))) { let h = +m[2]; if (/오후|저녁|밤/.test(m[1] || "") && h < 12) h += 12; time = String(h).padStart(2, "0") + ":" + (m[3] ? "30" : "00"); seg = seg.replace(m[0], " "); }

  } return out;
}
